<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f0eb" stop-opacity="1"/>
      <stop offset="55%" stop-color="#eeeae3" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e4dfd5" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="mistTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f0eb" stop-opacity="1"/>
      <stop offset="70%" stop-color="#f2f0eb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f2f0eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mistBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f0eb" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f2f0eb" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="sideL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2f0eb" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f2f0eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sideR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#f2f0eb" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f2f0eb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="420" fill="url(#sky)"/>

  <!-- far range -->
  <path d="M0 218 C140 188 230 168 340 178 C470 190 540 148 660 160 C780 172 870 138 1000 154 C1130 170 1240 148 1440 176 L1440 300 L0 300 Z"
        fill="#9e9588" fill-opacity="0.38"/>
  <path d="M60 236 C180 200 270 214 380 198 C500 180 580 214 700 200 C840 182 940 218 1080 204 C1220 190 1320 222 1440 214 L1440 310 L60 310 Z"
        fill="#8f8679" fill-opacity="0.42"/>

  <!-- near ridge -->
  <path d="M0 258 C110 232 200 248 300 236 C420 222 500 256 620 240 C760 220 860 258 1000 246 C1140 234 1260 262 1440 252 L1440 340 L0 340 Z"
        fill="#7a7266" fill-opacity="0.36"/>

  <!-- lake basin -->
  <ellipse cx="720" cy="304" rx="460" ry="54" fill="#8a8174" fill-opacity="0.16"/>
  <path d="M320 300 C480 284 600 292 720 298 C860 306 980 288 1120 302"
        stroke="#6f675c" stroke-opacity="0.35" stroke-width="1.4" fill="none"/>
  <path d="M380 314 C520 304 640 310 720 312 C840 316 960 304 1060 314"
        stroke="#6f675c" stroke-opacity="0.2" stroke-width="1.1" fill="none"/>

  <!-- boat -->
  <g transform="translate(708 294)" opacity="0.72">
    <path d="M-22 5 C-10 12 10 12 22 5 L14 10 C4 15 -4 15 -14 10 Z" fill="#4a443c"/>
    <path d="M0 -14 L0 5" stroke="#4a443c" stroke-width="1.5"/>
    <circle cx="0" cy="-16" r="2.6" fill="#4a443c"/>
  </g>

  <!-- left pines cluster -->
  <g fill="#4f4941" transform="translate(48 118)">
    <path d="M36 0 L62 86 L50 86 L66 158 L10 158 L26 86 L14 86 Z" fill-opacity="0.55"/>
    <path d="M0 42 L22 100 L14 100 L26 150 L-12 150 L0 100 L-8 100 Z" fill-opacity="0.42"/>
    <path d="M68 52 L86 108 L78 108 L90 152 L54 152 L66 108 L60 108 Z" fill-opacity="0.4"/>
    <rect x="30" y="156" width="10" height="52" rx="1.5" fill="#3f3a34" fill-opacity="0.55"/>
    <rect x="-4" y="148" width="6" height="42" rx="1" fill="#3f3a34" fill-opacity="0.4"/>
    <rect x="68" y="150" width="6" height="38" rx="1" fill="#3f3a34" fill-opacity="0.4"/>
  </g>
  <g fill="#4f4941" transform="translate(150 168) scale(0.78)" fill-opacity="0.38">
    <path d="M36 0 L62 86 L50 86 L66 158 L10 158 L26 86 L14 86 Z"/>
    <rect x="30" y="156" width="10" height="40" rx="1.5" fill="#3f3a34"/>
  </g>

  <!-- right pines -->
  <g fill="#4f4941" transform="translate(1268 126)">
    <path d="M36 0 L62 86 L50 86 L66 158 L10 158 L26 86 L14 86 Z" fill-opacity="0.52"/>
    <path d="M-10 48 L14 108 L6 108 L18 152 L-20 152 L-6 108 L-14 108 Z" fill-opacity="0.4"/>
    <path d="M74 58 L94 116 L86 116 L98 154 L62 154 L74 116 L68 116 Z" fill-opacity="0.36"/>
    <rect x="30" y="156" width="10" height="54" rx="1.5" fill="#3f3a34" fill-opacity="0.55"/>
    <rect x="-12" y="150" width="6" height="40" rx="1" fill="#3f3a34" fill-opacity="0.4"/>
  </g>
  <g fill="#4f4941" transform="translate(1188 176) scale(0.7)" fill-opacity="0.34">
    <path d="M36 0 L62 86 L50 86 L66 158 L10 158 L26 86 L14 86 Z"/>
    <rect x="30" y="156" width="10" height="38" rx="1.5" fill="#3f3a34"/>
  </g>

  <!-- seal / calligraphy -->
  <g transform="translate(1095 108)" opacity="0.34" fill="#5a5349">
    <text x="0" y="0" font-family="Georgia, serif" font-size="24" writing-mode="tb">??</text>
    <circle cx="30" cy="64" r="13" fill="none" stroke="#5a5349" stroke-width="1.4"/>
    <text x="23" y="69" font-family="Georgia, serif" font-size="11">?</text>
  </g>

  <rect width="1440" height="160" fill="url(#mistTop)"/>
  <rect y="330" width="1440" height="90" fill="url(#mistBot)"/>
  <rect width="200" height="420" fill="url(#sideL)"/>
  <rect x="1240" width="200" height="420" fill="url(#sideR)"/>
</svg>
